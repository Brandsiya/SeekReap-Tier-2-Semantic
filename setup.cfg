[metadata]
name = seekreap-tier2-semantic
version = 0.1.0
author = Brandsiya
author_email = architecture@seekreap.example.com
description = Tier-2 Semantic Core Library for SeekReap
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Brandsiya/SeekReap-Tier-2-Semantic
license = PROPRIETARY
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: Other/Proprietary License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = true
zip_safe = false

[options.packages.find]
where = src

[options.extras_require]
dev =
    black==24.0.0
    isort==6.0.0
    flake8==6.0.0
    mypy==1.4.1
tests =
    pytest==8.1.0
    pytest-cov==4.1.0
lint =
    black==24.0.0
    flake8==6.0.0
    isort==6.0.0
all =
    black==24.0.0
    isort==6.0.0
    flake8==6.0.0
    mypy==1.4.1
    pytest==8.1.0
    pytest-cov==4.1.0
